<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS&JS三种引入演示</title>
    <!-- 链入式CSS：外部css文件 -->
    <link rel="stylesheet" href="style.css">
    <!-- 内嵌式CSS -->
    <style>
        .text-blue{
            color:blue;
            font-size:20px;
        }
    </style>
</head>
<body>
    <!-- 行内式CSS -->
    <p style="color:red;font-size:24px;">行内CSS：文字红色24px</p>
    <p class="text-blue">内嵌CSS：文字蓝色20px</p>

    <!-- JS行内式 -->
    <button onclick="alert('行内JS触发')">点击测试行内JS</button>

    <!-- JS内嵌式 -->
    <script>
        let count = 0;
        setInterval(() => {
            count++;
            console.log("计数：" + count);
        }, 1000);
    </script>

    <!-- JS外链式 -->
    <script src="test.js"></script>
</body>
</html>
